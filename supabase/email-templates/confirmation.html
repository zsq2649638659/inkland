<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>确认 Inkland 邮箱</title>
  </head>
  <body style="margin:0;background:#faf9f7;color:#292724;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#fff;border-radius:16px;">
            <tr>
              <td style="padding:36px 32px;text-align:center;">
                <h1 style="margin:0 0 16px;font-size:24px;line-height:1.4;">确认你的 Inkland 邮箱</h1>
                <p style="margin:0 0 24px;color:#6b6862;font-size:15px;line-height:1.8;">
                  感谢注册 Inkland。点击下方按钮，在确认页中完成邮箱验证。
                </p>
                <a
                  href="{{ .SiteURL }}/auth/confirm?flow=signup&amp;manual=1&amp;token_hash={{ .TokenHash }}&amp;type=email"
                  style="display:inline-block;padding:13px 26px;border-radius:999px;background:#c76f52;color:#fff;font-size:15px;font-weight:600;text-decoration:none;"
                >确认邮箱</a>
                <p style="margin:24px 0 0;color:#8a867f;font-size:13px;line-height:1.7;">
                  如果这不是你发起的注册，请忽略此邮件。验证链接仅可使用一次。
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
