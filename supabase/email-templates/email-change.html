<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>确认 Inkland 邮箱变更</title>
  </head>
  <body style="margin:0;background:#faf9f7;color:#292724;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#fff;border-radius:16px;">
            <tr>
              <td style="padding:36px 32px;text-align:center;">
                <h1 style="margin:0 0 16px;font-size:24px;line-height:1.4;">确认 Inkland 邮箱变更</h1>
                <p style="margin:0 0 24px;color:#6b6862;font-size:15px;line-height:1.8;">
                  你申请将 Inkland 账号的绑定邮箱更改为 <strong>{{ .NewEmail }}</strong>。请点击下方链接完成确认。
                </p>
                <p style="margin:0 0 24px;">
                  <a
                    href="{{ .RedirectTo }}&amp;manual=1&amp;token_hash={{ .TokenHash }}&amp;type=email_change"
                    style="display:inline-block;padding:13px 26px;border-radius:999px;background:#c76f52;color:#fff;font-size:15px;font-weight:600;text-decoration:underline;"
                  >确认邮箱变更</a>
                </p>
                <p style="margin:0;color:#8a867f;font-size:13px;line-height:1.7;">
                  如果你没有发起此次更换，请忽略本邮件。若原邮箱也收到确认邮件，请完成那封邮件中的验证后，新邮箱才会生效。
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
